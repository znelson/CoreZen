name: Xcode - Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Only publish-dependencies writes to the repository
permissions:
  contents: read

jobs:
  build:
    name: Build and analyse default scheme using xcodebuild command
    # Xcode 27, which also built the dependency archive. Its libraries run on
    # macOS 14 or later, so they don't tie CI to a particular macOS version.
    runs-on: xcode-27
    environment: build-and-sign
    outputs:
      dependencies-key: ${{ steps.dependencies.outputs.key }}
      dependencies-published: ${{ steps.dependencies.outputs.published }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Formatting
        run: |
          brew install clang-format
          Scripts/format.sh --check

      # The project's version and CHANGELOG.md's newest version should match
      - name: Check Version
        run: |
          Scripts/check_version.py

      - name: Prepare Keychain For Signing
        env:
          SECRET_MACOS_CERTIFICATE_B64: ${{ secrets.MACOS_CERTIFICATE }}
          SECRET_MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          SECRET_KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PWD }}
        run: |
          # Set up path for certificate file
          CERTIFICATE_PATH=$RUNNER_TEMP/signing_certificate.p12
          echo Using signing certificate at: $CERTIFICATE_PATH

          # Decode base64 certificate secret into .p12 file
          echo -n "$SECRET_MACOS_CERTIFICATE_B64" | base64 --decode --output $CERTIFICATE_PATH

          # Set up path for keychain database
          KEYCHAIN_PATH=$RUNNER_TEMP/signing_keychain.keychain-db
          echo Using signing keychain at: $KEYCHAIN_PATH

          # Create and configure keychain database
          security create-keychain -p "$SECRET_KEYCHAIN_PWD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH

          # Unlock keychain before build process
          security unlock-keychain -p "$SECRET_KEYCHAIN_PWD" $KEYCHAIN_PATH

          # Import the signing certificate into keychain database
          security import $CERTIFICATE_PATH -P "$SECRET_MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      # Download the dependencies published for this checkout's key: a hash of
      # Scripts/build_dependencies.py, build_dependencies.json and its patches.
      # When a change to those means nothing is published yet, the steps after
      # this build them from source, once per key.
      - name: Download Dependencies
        id: dependencies
        run: |
          key=$(Scripts/build_dependencies.py --print-key)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          status=0
          Scripts/fetch_dependencies.py --repository "$GITHUB_REPOSITORY" || status=$?
          case $status in
            0) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            2) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) exit $status ;;
          esac

      - name: Restore Dependencies Built Earlier
        id: cache
        if: steps.dependencies.outputs.published == 'false'
        uses: actions/cache/restore@v6
        with:
          path: build/archive
          key: dependencies-${{ steps.dependencies.outputs.key }}

      # The build tools build_dependencies.py installs need Python 3.10 or later
      - name: Set Up Python
        if: steps.dependencies.outputs.published == 'false' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build Dependencies
        if: steps.dependencies.outputs.published == 'false'
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            Scripts/fetch_dependencies.py --archive build/archive/Dependencies.tar.gz
          else
            Scripts/build_dependencies.py --output Dependencies --archive build/archive/Dependencies.tar.gz
          fi

      # Saved right away, so a later failure doesn't mean building them again
      - name: Cache Built Dependencies
        if: steps.dependencies.outputs.published == 'false' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/archive
          key: dependencies-${{ steps.dependencies.outputs.key }}

      - name: Upload Built Dependencies
        if: steps.dependencies.outputs.published == 'false' && github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: dependencies
          path: build/archive
          if-no-files-found: error

      - name: Build
        run: |
          xcodebuild build -scheme CoreZen -project CoreZen.xcodeproj

      - name: Test
        run: |
          xcodebuild test -scheme CoreZen -project CoreZen.xcodeproj

      # Test again under sanitizers, which catch bugs that tests can pass despite:
      # Thread Sanitizer finds data races, Address Sanitizer finds memory errors,
      # and Undefined Behavior Sanitizer finds things like signed overflow. Thread
      # and Address Sanitizer can't run together, hence two runs. A sanitizer's
      # first report stops the tests, which fails the step.
      - name: Test With Thread Sanitizer
        run: |
          xcodebuild test -scheme CoreZen -project CoreZen.xcodeproj -enableThreadSanitizer YES

      - name: Test With Address And Undefined Behavior Sanitizers
        run: |
          xcodebuild test -scheme CoreZen -project CoreZen.xcodeproj -enableAddressSanitizer YES -enableUndefinedBehaviorSanitizer YES

      - name: Analyze
        run: |
          xcodebuild analyze -scheme CoreZen -project CoreZen.xcodeproj

  # When a push to main built dependencies from source and its tests passed,
  # publish them as the release dependencies-<key>. Later runs, and anyone
  # running Scripts/fetch_dependencies.py, download them from there. They're
  # prereleases so GitHub never shows one as the repository's latest release:
  # it picks the newest full release unless one is marked latest, so
  # --latest=false alone didn't keep them off. Prerelease downloads are public too.
  publish-dependencies:
    name: Publish dependencies built from source
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.dependencies-published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Built Dependencies
        uses: actions/download-artifact@v8
        with:
          name: dependencies

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ needs.build.outputs.dependencies-key }}
        run: |
          tag="dependencies-$KEY"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is already published"
            exit 0
          fi
          {
            echo "Built by CI from $GITHUB_SHA with \`Scripts/build_dependencies.py\`."
            echo "\`Scripts/fetch_dependencies.py\` downloads it for checkouts whose key is \`$KEY\`."
            echo
            echo '```'
            tar -xzOf Dependencies.tar.gz Dependencies/dependencies.resolved
            echo '```'
          } > notes.md
          gh release create "$tag" Dependencies.tar.gz Dependencies.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Dependencies $KEY" --notes-file notes.md --prerelease
